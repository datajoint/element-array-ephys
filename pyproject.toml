[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "element-array-ephys"
dynamic = ["version"]
description = "Extracellular Array Electrophysiology DataJoint Element"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
authors = [{ name = "DataJoint", email = "info@datajoint.com" }]
keywords = ["neuroscience", "electrophysiology", "science", "datajoint"]
requires-python = ">=3.11"
dependencies = [
    # The code uses the datajoint 0.14 API (dj.schema(), dj_local_conf.json),
    # which 2.x removed. 0.14.10 is the first 0.14 release without
    # pkg_resources; pin it exactly, matching U19-pipeline-python.
    "datajoint==0.14.10",
    "ipykernel>=6.0.1",
    "ipywidgets",
    "openpyxl",
    "plotly",
    "seaborn",
    "spikeinterface",
    "scikit-image>=0.20",
    "nbformat>=4.2.0",
    "pyopenephys>=1.1.6",
]

[project.optional-dependencies]
elements = [
    "element-animal @ git+https://github.com/datajoint/element-animal.git",
    "element-event @ git+https://github.com/datajoint/element-event.git",
    "element-interface @ git+https://github.com/datajoint/element-interface.git",
    "element-lab @ git+https://github.com/datajoint/element-lab.git",
    "element-session @ git+https://github.com/datajoint/element-session.git",
]
nwb = ["dandi", "neuroconv[ecephys]", "pynwb"]
tests = ["pre-commit", "pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/datajoint/element-array-ephys"
Source = "https://github.com/BrainCOGS/element-array-ephys"

[dependency-groups]
dev = [
    # Not a runtime dependency in the metadata (upstream only lists it under the
    # `elements` extra), but every ephys module imports it, so the import smoke
    # test needs it. Consumers such as U19-pipeline-python install it themselves.
    "element-interface @ git+https://github.com/datajoint/element-interface.git",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.setuptools.dynamic]
version = { attr = "element_array_ephys.version.__version__" }

[tool.setuptools.packages.find]
include = ["element_array_ephys*"]

[tool.uv]
# Supply-chain quarantine: ignore anything published in the last 7 days when
# resolving. A compromised release is usually caught and yanked within days, so
# waiting a week costs little and skips the window when a malicious version is
# most likely to still be up. uv re-evaluates this relative value on every
# resolution, so the window rolls forward on its own. "7 days" is the documented
# friendly-duration form (ISO 8601 "P7D" is equivalent).
#
# Consequence to expect: immediately after an upstream release, `uv lock` will
# decline to pick it up until it is a week old. That is the feature working. To
# take a fresh release deliberately, run
#   uv lock --exclude-newer <a timestamp after that upload>
# or add a scoped exemption via `exclude-newer-package`.
exclude-newer = "7 days"

# `uv audit` is still gated behind a preview flag. Declaring it here means the
# command runs without `--preview-features audit-command` on the command line,
# so local runs and the CI audit job invoke it identically.
preview-features = ["audit-command"]

[tool.ruff]
# Upstream formats with black at 88; keep it so upstream merges stay clean.
line-length = 88
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
extend-select = [
    "A",    # flake8-builtins: shadowing built-ins
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "T100", # leftover breakpoints / debugger calls
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
]
ignore = [
    # Reference ignores: mixedCase class attrs, arg shadows builtin, non-lowercase local var.
    "N815",
    "A002",
    "N806",
    "B905",  # zip(strict=) would raise on length mismatches the code tolerates today
    "B904",  # `raise ... from err` changes the exception chain callers see
    "B006",  # mutable defaults: changing signatures is a behavior change
    "B007",  # unused loop vars: some are read after the loop; renaming is upstream churn
    "B028",  # warnings stacklevel changes where users see the warning
    # Widespread findings (several files each) whose fixes are manual edits to
    # upstream code; ignored to keep upstream merges workable.
    "E501",    # line length: ruff-format owns wrapping; the rest are long strings/comments
    "C408",    # dict()/list() calls -> literals: pure style, 30 sites
    "C416",    # unnecessary comprehension: style only, no safe autofix
    "N803",    # argument names are public API (e.g. `KS`-style kwargs)
    "RUF012",  # mutable class attrs: DataJoint Lookup `contents = [...]` is the API
    "RUF013",  # implicit Optional in annotations: typing-only, 28 sites
    "DTZ",     # adding time zones would change stored/compared datetimes
    "RUF007",  # zip(x, x[1:]) -> pairwise: style only
    "RUF059",  # unused unpacked vars: renaming is upstream churn
    "TRY201",  # `raise err` -> bare `raise`: changes the reported traceback
    "SIM102",  # collapsible nested ifs: manual restructuring of upstream logic
]

[tool.ruff.lint.per-file-ignores]
# Public re-exports (`element_array_ephys.ephys`, `probe.build_electrode_layouts`).
"element_array_ephys/__init__.py" = ["F401"]
"element_array_ephys/probe.py" = ["F401"]
# DataJoint resolves Subject, Lab, Experimenter, ... from this module's namespace
# via linking_module=__name__, so the "unused" imports are load-bearing.
"tests/tutorial_pipeline.py" = ["F401", "F822"]
# Single-site findings, kept narrow. None has a safe autofix, and each fix
# would rewrite upstream code:
# N802: Allen pipeline method names; SIM112: reads the lowercase env vars it
# sets; BLE001: best-effort cleanup that must not raise.
"element_array_ephys/readers/kilosort_triggering.py" = ["N802", "SIM112", "BLE001"]
# BLE001: any connection failure means "no database here", so the test skips.
"tests/conftest.py" = ["BLE001"]
# C402: generator inside dict(); SIM118: `in d.keys()`. Style only.
"element_array_ephys/export/nwb/nwb.py" = ["C402", "SIM118"]
# C406: dict([...]) literal. Style only.
"element_array_ephys/readers/probe_geometry.py" = ["C406"]
# FURB192: sorted()[0] -> min(); SIM108: if/else -> ternary. Style only.
"element_array_ephys/readers/openephys.py" = ["FURB192", "SIM108"]
# SIM105: try/except/pass -> contextlib.suppress. Style only.
"element_array_ephys/readers/utils.py" = ["SIM105"]
# SIM115: open() without a context manager; changing it changes file lifetime.
"element_array_ephys/readers/kilosort.py" = ["SIM115"]
# FURB136: `a if a < b else b` -> min(): differs for NaN and ties.
"element_array_ephys/plotting/unit_level.py" = ["FURB136"]

[tool.pytest.ini_options]
minversion = "9.0"
# pytest 9 reads pyproject.toml natively and requires "args"-type options to be
# TOML lists. No --doctest-modules: importing the ephys modules for doctests
# would declare DataJoint schemas, and there are no doctests to run.
addopts = [
    "-ra",
    "--showlocals",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
]
xfail_strict = true
log_level = "INFO"
testpaths = ["tests"]
filterwarnings = [
    "error",
    # datajoint calls pyparsing APIs that pyparsing itself deprecated
    # (delimitedList, setResultsName, ...) at import time.
    "ignore::pyparsing.warnings.PyparsingDeprecationWarning",
]
