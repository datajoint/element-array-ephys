# Dependabot configuration.
#
# Template: BrainCOGS/U19-pipeline-python .github/dependabot.yml (keep in sync
# when changing policy).
#
# Every ecosystem waits 7 days (`cooldown`) before proposing a new release, to
# skip the window when a compromised release is most likely still published.
# uv itself applies the same quarantine via `exclude-newer = "7 days"` in
# pyproject.toml.
#
# No `pip` entry: element_array_ephys/export/nwb/requirements.txt is not read
# by the packaging; dependencies live in pyproject.toml / uv.lock.

version: 2

updates:
  #
  # GitHub Actions (.github/workflows/)
  #
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7

    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"
      - "github-actions"

    commit-message:
      prefix: "ci"

    rebase-strategy: "auto"

    # A group without `applies-to` only batches scheduled version updates.
    # Security updates are grouped separately, so declare both or the
    # security fixes keep arriving as one PR per package.
    groups:
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
      github-actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  #
  # Docker (devcontainer image and the docs build image)
  #
  - package-ecosystem: "docker"
    directories:
      - "/.devcontainer"
      - "/docs/.docker"
    cooldown:
      default-days: 7

    schedule:
      interval: "monthly"
      day: "tuesday"
      time: "06:00"
      timezone: "UTC"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"
      - "docker"

    commit-message:
      prefix: "docker"

    rebase-strategy: "auto"

    # See the github-actions entry above: version and security updates are
    # grouped independently, so both need a group.
    groups:
      docker:
        applies-to: "version-updates"
        patterns:
          - "*"
      docker-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  #
  # Python / uv (pyproject.toml + uv.lock)
  #
  - package-ecosystem: "uv"
    directory: "/"
    cooldown:
      default-days: 7

    schedule:
      interval: "monthly"
      day: "wednesday"
      time: "06:00"
      timezone: "UTC"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"

    commit-message:
      prefix: "deps"

    rebase-strategy: "auto"

    # See the github-actions entry above.
    groups:
      python:
        applies-to: "version-updates"
        patterns:
          - "*"
      python-security:
        applies-to: "security-updates"
        patterns:
          - "*"

    ignore:
      # datajoint 2.x removed dj.schema and ignores the dj_local_conf.json that
      # the BrainCOGS repos ship, so `import element_array_ephys` fails on it.
      # pyproject.toml and U19-pipeline-python pin datajoint==0.14.10 for the
      # same reason. Remove
      # once the datajoint 2.x migration lands.
      - dependency-name: "datajoint"
        versions:
          - ">=2.0"
